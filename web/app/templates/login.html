{% extends "base.html" %}

{% block title %}Login & Register — The Great Books{% endblock %}

{% block content %}
<section id="page-auth" class="page">
    <div class="auth-wrapper">
        <div class="auth-tabs">
            <button id="tab-login" class="tab-btn active" onclick="switchAuthTab('login')">Login</button>
            <button id="tab-register" class="tab-btn" onclick="switchAuthTab('register')">Register</button>
        </div>

        <form id="login-form" class="auth-form" onsubmit="handleLogin(event)">
            <h2>Enter the Realm</h2>
            <label>Username
                <input type="text" id="login-username" required placeholder="name">
            </label>
            <label>Password
                <input type="password" id="login-password" required placeholder="••••••••">
            </label>
            <button type="submit" class="btn-primary">Sign In</button>
        </form>

        <form id="register-form" class="auth-form hidden" onsubmit="handleRegister(event)">
            <h2>Swear Your Oath</h2>
            <label>Username
                <input type="text" id="reg-username" required placeholder="username">
            </label>
            <label>Password
                <input type="password" id="reg-password" required placeholder="••••••••">
            </label>
            <label>Social Role (Title)
                <select id="reg-role" required onchange="onRegRoleChange()">
                    <option value="">Loading roles...</option>
                </select>
            </label>

            <div id="white-knight-group" class="hidden" style="margin-top: 0.75rem; padding: 0.65rem 0.85rem; border: 1px solid rgba(212, 175, 55, 0.35); border-radius: 6px; background: rgba(255, 255, 255, 0.03);">
                <label for="reg-white-knight" style="display: flex !important; flex-direction: row !important; align-items: center !important; justify-content: flex-start !important; gap: 0.65rem; margin: 0 !important; cursor: pointer; text-align: left;">
                    <input type="checkbox" id="reg-white-knight" onchange="onWhiteKnightToggle()" style="width: 18px !important; height: 18px !important; min-width: 18px; margin: 0 !important; accent-color: #d4af37; cursor: pointer; flex-shrink: 0;">
                    <span style="line-height: 1.3;">Is White Knight? <small class="muted">(Kingsguard — sworn to no Great House)</small></span>
                </label>
            </div>

            <label id="reg-house-label">Great House Allegiance
                <select id="reg-house">
                    <option value="">No House (Free Rider / Commonfolk)</option>
                </select>
            </label>
            <button type="submit" class="btn-primary">Create Account</button>
        </form>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='auth.js') }}"></script>
{% endblock %}
