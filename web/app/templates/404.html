{% extends "base.html" %}

{% block title %}404 — Page Not Found | The Great Books{% endblock %}

{% block content %}
<section class="page" style="display: flex; justify-content: center; align-items: center; padding: 3rem 0;">
    <div style="max-width: 480px; width: 100%; padding: 2.5rem; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; text-align: center;">
        <h1 style="font-size: 3.5rem; margin: 0; color: var(--gold); line-height: 1;">404</h1>
        <h2 style="font-size: 1.4rem; margin-top: 1rem; margin-bottom: 0.75rem; color: #fff;">Lost in the Realm</h2>
        <p style="color: var(--text-muted); font-size: 0.95rem; line-height: 1.5; margin-bottom: 2rem;">
            The scroll or hall you seek does not exist in the Citadel's archives, or has been lost to time.
        </p>
        <div style="display: flex; gap: 1rem; justify-content: center; align-items: center; flex-wrap: wrap;">
            <a href="/" class="btn-primary" style="margin-top: 0; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; padding: 0.65rem 1.25rem;">Return to Great Houses</a>
            <a href="/login" class="btn-secondary" style="text-decoration: none; display: inline-flex; align-items: center; justify-content: center; padding: 0.65rem 1.25rem;">Go to Login</a>
        </div>
    </div>
</section>
{% endblock %}
