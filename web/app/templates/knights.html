{% extends "base.html" %}

{% block title %}Book of Knights — The Great Books{% endblock %}

{% block content %}
<section id="page-knights" class="page">
    <div class="page-header">
        <div>
            <h1>Book of Knights</h1>
            <p class="subtitle">Official Tournament & Sworn Swords Registry of Westeros</p>
        </div>
        <div id="user-badge-knights" class="role-badge">Guest (Spectator)</div>
    </div>

    <div class="toolbar">
        <input type="text" id="search-knights" class="search-input" placeholder="Search by knight name..."
            oninput="renderBook('knight')">
        <select id="filter-knights" class="filter-select" onchange="renderBook('knight')">
            <option value="all">All Great Houses</option>
        </select>
    </div>

    <div id="notice-knights" class="notice-banner hidden"></div>
    <div id="grid-knights" class="cards-grid"></div>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='books.js') }}"></script>
{% endblock %}
